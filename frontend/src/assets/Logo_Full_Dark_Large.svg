<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trackGradient-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="shieldGradient-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Track curves in background -->
    <path d="M 12 40 Q 24 24, 40 28 T 68 40"
      stroke="#059669" stroke-width="1.6" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M 12 48 Q 24 32, 40 36 T 68 48"
      stroke="#10B981" stroke-width="1.2" fill="none" opacity="0.2" stroke-linecap="round"/>
    
    <!-- Shield Shape -->
    <path d="M 40 8 L 60 16 L 60 36 Q 60 56, 40 68 Q 20 56, 20 36 L 20 16 Z"
      fill="url(#shieldGradient-dark)" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Inner Shield Accent -->
    <path d="M 40 14.399999999999999 L 54.400000000000006 20 L 54.400000000000006 36 Q 54.400000000000006 50.4, 40 60 Q 25.6 50.4, 25.6 36 L 25.6 20 Z"
      fill="none" stroke="#059669" stroke-width="1.2" opacity="0.3" stroke-linejoin="round"/>
    
    <!-- Checkmark -->
    <path d="M 30.4 38.4 L 36.800000000000004 46.4 L 49.6 30.4"
      stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Checkmark highlight -->
    <path d="M 30.4 38.4 L 36.800000000000004 46.4 L 49.6 30.4"
      stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
  
  
  <!-- Text Group -->
  <g>
    <!-- ComplyTrack Text -->
    <text x="110" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#0F172A">
      <tspan>Comply</tspan><tspan fill="#059669">Track</tspan>
    </text>
    
    
    <!-- Slogan Text -->
    <text x="110" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#64748B" letter-spacing="0.5">
      Master compliance. Protect investments.
    </text>
    
  </g>
  
</svg>